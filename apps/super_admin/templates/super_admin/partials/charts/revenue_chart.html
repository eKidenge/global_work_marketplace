<div style="padding: 24px;">
    <div style="margin-bottom: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #1a2b4a; font-weight: 600;">Revenue by Type</div>
    <table style="width: 100%; border-collapse: collapse;">
        {% for row in revenue_stats %}
        <tr style="border-bottom: 1px solid #e5e0d3;">
            <td style="padding: 10px 0; font-family: 'Source Serif 4', serif; font-size: 14px; color: #1e293b;">{{ row.type|title|default:"—" }}</td>
            <td style="padding: 10px 0; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #1a2b4a; font-weight: 600;">{{ row.total|default:0|floatformat:0 }} sats</td>
        </tr>
        {% empty %}
        <tr><td colspan="2" style="text-align: center; color: #64748b; padding: 24px 0; font-size: 13px;">No revenue data.</td></tr>
        {% endfor %}
    </table>
</div>
