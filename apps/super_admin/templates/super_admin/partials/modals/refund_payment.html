<div id="refundPaymentModal" style="display:none;position:fixed;inset:0;background:rgba(15,17,25,0.5);z-index:1000;align-items:center;justify-content:center;">
    <div style="background:#fdfcf8;border:1px solid #c9c2b0;padding:28px;max-width:440px;width:90%;">
        <h3 style="font-size:20px;font-weight:700;margin-bottom:6px;font-family:'Source Serif 4',serif;color:#1a2b4a;">Issue Refund</h3>
        <p id="refundTargetInfo" style="font-size:13px;color:#64748b;margin-bottom:20px;font-family:'IBM Plex Mono',monospace;"></p>
        <form method="post" action="" id="refundPaymentForm">
            {% csrf_token %}
            <div style="margin-bottom:20px;">
                <label style="display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:#1a2b4a;margin-bottom:8px;font-family:'IBM Plex Mono',monospace;">Reason (optional)</label>
                <textarea name="reason" style="width:100%;min-height:90px;padding:10px 14px;font-size:14px;border:1px solid #c9c2b0;background:#fdfcf8;color:#1a2b4a;border-radius:0;font-family:'Source Serif 4',serif;resize:vertical;"></textarea>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button type="button" class="btn btn-outline" onclick="document.getElementById('refundPaymentModal').style.display='none'">Cancel</button>
                <button type="submit" class="btn btn-primary" style="background:#991b1b;border-color:#991b1b;">Confirm Refund</button>
            </div>
        </form>
    </div>
</div>
